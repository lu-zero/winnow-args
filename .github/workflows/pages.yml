name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # The upstream release still ships <html lang="ja">; pin the fork commit
      # that carries the language fix until the upstream PR is released.
      - name: Install guidebook from fork
        run: |
          cargo install guidebook \
            --git https://github.com/lu-zero/guidebook.git \
            --rev 42ddbd760bc8e08ea4bb267bb9973474ba572d86 \
            --locked --root "$RUNNER_TEMP/guidebook"
          echo "$RUNNER_TEMP/guidebook/bin" >> "$GITHUB_PATH"
      # lu-zero.github.io/winnow-args/ until a custom domain is set, then the domain's root.
      - run: |
          python3 site/stage.py
          guidebook build target/site-src -o target/site
          touch target/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
