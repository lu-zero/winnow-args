[package]
name = "winnow-args"
description = "Command line argument parsing built from winnow parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "argument", "parser", "winnow", "derive"]
categories = ["command-line-interface"]

[features]
default = ["derive", "help-text"]
derive = ["dep:winnow-args-derive"]
# The prose of derived help: descriptions, about and after text. Without it,
# help still lists commands, flags, values and defaults.
help-text = []
# Wrap help to the terminal's width when `COLUMNS` does not say, as clap's
# `wrap_help` does.
terminal-size = ["dep:terminal_size"]
# Measure help in terminal columns, a wide character two and a combining mark
# none, as clap's `unicode` does; else one column a character.
unicode = ["dep:unicode-width"]

[dependencies]
winnow.workspace = true
winnow-args-derive = { workspace = true, optional = true }
terminal_size = { version = "0.4", optional = true }
unicode-width = { version = "0.2", optional = true }

[[example]]
name = "example"
path = "../examples/example.rs"
required-features = ["derive"]

[[example]]
name = "help"
path = "../examples/help.rs"
required-features = ["derive"]

[[example]]
name = "gallery"
path = "../examples/gallery.rs"
required-features = ["derive"]

[[example]]
name = "brush_builtins"
path = "../examples/brush_builtins.rs"
required-features = ["derive"]

[[example]]
name = "ld"
path = "../examples/ld.rs"
required-features = ["derive"]

[[example]]
name = "deprecated"
path = "../examples/deprecated.rs"
required-features = ["derive"]

[dev-dependencies]
trybuild = "1"
winnow-args-spec.workspace = true
