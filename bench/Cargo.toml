# The same tiny CLI — `example -v/--verbose -p/--path=PATH` — in each framework,
# measured the way ../usage/benches/gate measures its mise shadows: one binary per
# framework that parses its own argv PARSE_N times, so N=1 minus N=0 under
# cachegrind is one cold parse in a fresh process. See `just perf`.
[package]
name = "bench"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
default = ["help-text"]
# `--no-default-features` builds every winnow-args binary without help prose.
help-text = ["winnow-args/help-text"]
# Wrap help to the terminal, for measuring what probing it costs.
terminal-size = ["winnow-args/terminal-size"]

[dependencies]
winnow.workspace = true
winnow-args.workspace = true
# bpaf 0.10 is not on crates.io: a pinned git commit (see the workspace manifest).
bpaf.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# The reference: usage's compiled, zero-allocation parser, as its mise shadow uses it.
usage-argv = { version = "6.11", features = ["spec"] }
usage-derive = "6.11"
# mise at full scale: usage's shadows of `mise.usage.kdl`, vendored unmodified in
# shadows/, and ours (`shadow-mise-wa`, translated from usage's by
# `cargo run -p xtask -- gen mise-shadow`).
shadow-mise = { path = "shadows/mise" }
shadow-mise-clap = { path = "shadows/mise-clap" }
shadow-mise-bpaf010 = { path = "shadows/mise-bpaf010" }
shadow-mise-wa = { path = "shadows/mise-wa" }
