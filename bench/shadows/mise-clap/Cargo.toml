# Vendored from usage (https://github.com/jdx/usage, MIT, see ../LICENSE-usage)
# at 19a2974b: benches/shadows/mise-clap/src/lib.rs, here `src/shadow.rs`,
# generated there by `cargo run -p xtask -- gen-shadow`. Ours are this manifest
# (dependencies from crates.io, or git for the unpublished bpaf 0.10) and
# `src/lib.rs`, which loads the shadow.
[package]
name = "shadow-mise-clap"
version = "0.0.0"
edition = "2021"
publish = false


[dependencies]
clap = { version = "4", features = ["derive", "env"] }

[lints.rust]
missing_docs = "allow"

# The doc comments are mise's help text, not rustdoc.
[lints.rustdoc]
broken_intra_doc_links = "allow"
bare_urls = "allow"
invalid_html_tags = "allow"
invalid_rust_codeblocks = "allow"
