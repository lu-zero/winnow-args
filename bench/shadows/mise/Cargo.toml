# Vendored from usage (https://github.com/jdx/usage, MIT, see ../LICENSE-usage)
# at 19a2974b: benches/shadows/mise/src/lib.rs, here `src/shadow.rs`,
# generated there by `cargo run -p xtask -- gen-shadow`. Ours are this manifest
# (dependencies from crates.io) and `src/lib.rs`, which loads the shadow.
[package]
name = "shadow-mise"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
usage-argv = { version = "6.11", features = ["spec"] }
usage-derive = "6.11"

[lints.rust]
missing_docs = "allow"

# The doc comments are mise's help text, not rustdoc.
[lints.rustdoc]
broken_intra_doc_links = "allow"
bare_urls = "allow"
invalid_html_tags = "allow"
invalid_rust_codeblocks = "allow"
