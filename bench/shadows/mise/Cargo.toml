# Vendored from usage (https://github.com/jdx/usage, MIT, see ../LICENSE-usage)
# at 19a2974b: benches/shadows/mise/src/lib.rs, generated there by
# `cargo run -p xtask -- gen-shadow`. Only this manifest differs: dependencies
# come from crates.io (or git, for the unpublished bpaf 0.10).
[package]
name = "shadow-mise"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# The doc comments are copied help text, full of indented examples.
doctest = false

[dependencies]
usage-argv = { version = "6.11", features = ["spec"] }
usage-derive = "6.11"

[lints.rust]
missing_docs = "allow"

# The doc comments are mise's help text, not rustdoc.
[lints.rustdoc]
broken_intra_doc_links = "allow"
bare_urls = "allow"
invalid_html_tags = "allow"
invalid_rust_codeblocks = "allow"
