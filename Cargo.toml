[workspace]
resolver = "3"
members = [
    "winnow-args",
    "winnow-args-derive",
    "bench",
    "bench/shadows/mise",
    "bench/shadows/mise-bpaf010",
    "bench/shadows/mise-clap",
    "bench/shadows/mise-wa",
    "xtask",
]
# Plain `cargo build`, `test`, `doc` and `run` are about the library; the
# benches need `--workspace` or `-p bench`.
default-members = ["winnow-args", "winnow-args-derive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/lu-zero/winnow-args"

[workspace.dependencies]
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }
# bpaf 0.10 is not on crates.io: the bench compares against this commit.
bpaf = { git = "https://github.com/pacak/bpaf", rev = "844357fec9921634049ee8cf3f67ae7803d28e6f", features = ["derive"] }
winnow-args = { path = "winnow-args", version = "0.1.0", default-features = false, features = ["derive"] }
winnow-args-derive = { path = "winnow-args-derive", version = "=0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[profile.release]
debug = 1

# One codegen unit and fat LTO: sizes and instruction counts that do not move
# with codegen-unit partitioning (docs/PERF.md step 27). `PROFILE=release-lto
# tasks/perf.sh`.
[profile.release-lto]
inherits = "release"
codegen-units = 1
lto = "fat"
