[workspace]
resolver = "3"
members = [
    "winnow-args",
    "winnow-args-derive",
    "benchmarks",
    "benchmarks/shadows/mise",
    "benchmarks/shadows/mise-bpaf",
    "benchmarks/shadows/mise-clap",
    "benchmarks/shadows/mise-wa",
    "winnow-args-spec",
    "xtask",
]
# bpaf 0.10 comes from git: kept out, so that it going out of sync breaks nothing.
exclude = ["benchmarks/bpaf010"]
# Plain `cargo build`, `test`, `doc` and `run` are about the library; the
# benches need `--workspace` or `-p bench`.
default-members = ["winnow-args", "winnow-args-derive"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/lu-zero/winnow-args"

[workspace.dependencies]
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }
bpaf = { version = "0.9", features = ["derive"] }
winnow-args = { path = "winnow-args", version = "0.1.1", default-features = false, features = ["derive"] }
winnow-args-derive = { path = "winnow-args-derive", version = "=0.1.2" }
winnow-args-spec = { path = "winnow-args-spec", version = "0.1.2" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[profile.release]
debug = 1

# One codegen unit and fat LTO: sizes and instruction counts that do not move
# with codegen-unit partitioning (docs/PERF.md step 27). `PROFILE=release-lto
# just perf`.
[profile.release-lto]
inherits = "release"
codegen-units = 1
lto = "fat"
